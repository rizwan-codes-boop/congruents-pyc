[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "congruents"
version = "0.4.0"
description = "Galaxy emission modelling with Python preparation and OpenMP stages"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

# Astropy is an input-unit convenience, not a replacement for frozen constants.
# Native GSL/OpenMP compilation remains an explicit Makefile step.
[project.optional-dependencies]
units = ["astropy>=5"]

[tool.setuptools.packages.find]
where = ["src"]
